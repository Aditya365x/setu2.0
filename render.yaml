# Render Blueprint for the SETU backend.
#
# The two frontends are NOT here — they are static builds on Vercel, pointed at
# this API by VITE_API_ORIGIN. See docs/DEPLOY.md.
#
# Three resources on Render's FREE tier: the API, Postgres and Redis.
#
# There is deliberately no separate worker service. Render offers no free plan
# for background workers, and the optimiser is not optional — it is sixteen
# permanent asyncio loops, one per district, and without them reports arrive and
# cluster but nothing is ever scored, assigned or dispatched. So RUN_WORKER_IN_API
# runs those loops inside the API process instead.
#
# That is a trade, not a simplification. A dedicated worker (which is what
# docker-compose.yml runs, and what `plan: starter` would buy here) keeps the
# solver off the request event loop and lets either side restart alone. Free
# also means the service sleeps when idle, which takes the optimiser down with
# it — open the dashboard a few minutes before you need it.

services:
  # ── API ────────────────────────────────────────────────────────────────
  - type: web
    name: setu-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore          # closest Render region to the Bay of Bengal
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Render injects postgresql://... and SQLAlchemy's async engine rejects
      # it. config.py rewrites the prefix to postgresql+asyncpg:// so this can
      # be wired straight through.
      - key: DATABASE_URL
        fromDatabase:
          name: setu-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: setu-redis
          property: connectionString

      # First boot has no shell to run `make seed` in, so seed all 16 districts
      # on start. Every step checks for existing rows first, so restarts are a
      # no-op. The first run inserts ~73,000 rows and takes a minute or two,
      # so expect the first health check to be slow.

      # No free background-worker plan exists on Render, so the optimiser runs
      # inside this process. A dedicated worker is the correct shape and is what
      # docker-compose.yml does; this is the concession that makes a free
      # deployment actually dispatch instead of silently piling up incidents.
      - key: RUN_WORKER_IN_API
        value: "true"

      - key: SEED_ON_START
        value: "true"

      # CAP alerts run from fixtures/ so the demo works with no egress.
      - key: OFFLINE_MODE
        value: "true"
      # Live weather drives the per-district hazard outlook. Separate switch:
      # CAP has a fixture to fall back on, conditions do not.
      - key: LIVE_CONDITIONS
        value: "true"

      # MUST be set. The salt is what makes the phone-number HMAC
      # irreversible; shipping the dev default would de-anonymise every report
      # ever filed. generateValue gives a random value Render keeps secret.
      - key: REPORTER_HASH_SALT
        generateValue: true
      - key: JWT_SECRET
        generateValue: true

      - key: PYTHONUNBUFFERED
        value: "1"

  # ── Redis ──────────────────────────────────────────────────────────────
  # Optimizer queue, WebSocket pub/sub fan-out, CAP ETag and weather caches.
  - type: redis
    name: setu-redis
    plan: free
    region: singapore
    maxmemoryPolicy: noeviction   # the optimize queue must not be evicted
    ipAllowList: []               # private network only

databases:
  # ── Postgres + PostGIS ─────────────────────────────────────────────────
  # PostGIS is not optional. Clustering, the 50 km lookups, incident centroids,
  # shelter proximity and every boundary test are ST_* calls in SQL — there is
  # no application-layer fallback. Render's Postgres supports the extension;
  # schema.sql runs CREATE EXTENSION IF NOT EXISTS postgis on boot.
  - name: setu-db
    databaseName: setu
    user: setu
    plan: free
    region: singapore

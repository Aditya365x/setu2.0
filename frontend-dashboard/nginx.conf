server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  location /media/ {
    proxy_pass http://api:8000;
  }

  # The offline basemap: one 6.7 MB PMTiles archive plus its glyphs. MapLibre
  # reads the archive with HTTP range requests, which nginx serves natively for
  # static files — that is the whole trick, and it means no tile server.
  # Content is immutable per build, so cache it hard: a demo reset must never
  # re-download the map.
  location /basemap/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    types { }
    default_type application/octet-stream;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

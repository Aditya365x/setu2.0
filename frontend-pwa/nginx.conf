# ── shared upstream resolution ──────────────────────────────────────────────
#
# Both directives live here, at http context, and NOT inside a server block.
# That is deliberate and it is a bug fix.
#
# nginx resolves a literal hostname in proxy_pass exactly once, when the worker
# starts, and caches that IP for the life of the container. Rebuild the api
# service — which happens constantly in development and at least once on demo
# morning — and it returns on a NEW container IP while nginx keeps proxying to
# the old one. Every /api call then 502s while `curl` straight to :8000 answers
# 200, which makes it look like the frontend is at fault.
#
# Assigning the upstream to a variable forces per-request resolution. But `set`
# is only valid inside a server block, so the first version of this fix defined
# the variables in the :80 block only — leaving the :443 block referencing empty
# variables. nginx answered `invalid URL prefix in ""` and returned 500 for
# EVERY api call over HTTPS, which is the only scheme a phone can use, while
# HTTP on the laptop kept working perfectly and hid it.
#
# `map` is http-context, so one definition covers every server block and the two
# can never drift apart again.
resolver 127.0.0.11 valid=10s ipv6=off;

map $host $api_upstream {
  default http://api:8000;
}

# The offline basemap is a 50 MB PMTiles archive that lives in the dashboard
# image. Proxied rather than duplicated: a second copy inside the PWA image
# would double the build for a byte-identical file that the citizen app only
# needs when somebody opens a shelter map.
map $host $basemap_upstream {
  default http://dashboard:80;
}

# Plain HTTP, for the laptop and for anything behind a real proxy.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
  }

  # proxy_buffering off so MapLibre's HTTP range requests pass straight through.
  # Buffering a 50 MB archive to satisfy a 16 kB range would be pathological.
  location /basemap/ {
    proxy_pass $basemap_upstream;
    proxy_buffering off;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Never cache the service worker, or a stale one pins the app to an old build.
  location = /sw.js { add_header Cache-Control "no-cache"; }

  location / { try_files $uri $uri/ /index.html; }
}

# HTTPS, because geolocation, camera and service workers require a secure
# context on any host that is not localhost — which is every phone.
server {
  listen 443 ssl;
  http2 on;
  root /usr/share/nginx/html;
  index index.html;

  ssl_certificate     /etc/nginx/certs/setu.crt;
  ssl_certificate_key /etc/nginx/certs/setu.key;
  ssl_protocols TLSv1.2 TLSv1.3;

  location /api/ {
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
  }

  location /basemap/ {
    proxy_pass $basemap_upstream;
    proxy_buffering off;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location = /sw.js { add_header Cache-Control "no-cache"; }

  location / { try_files $uri $uri/ /index.html; }
}

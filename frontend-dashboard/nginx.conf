server {
  listen 80;
  root /usr/share/nginx/html;

  # Re-resolve `api` on every request instead of once at startup.
  #
  # nginx resolves a literal hostname in proxy_pass exactly once, when the
  # worker starts, and caches that IP for the life of the container. Rebuild the
  # api service — which happens constantly during development and at least once
  # on demo morning — and it comes back on a NEW container IP while this nginx
  # keeps proxying to the old one. Every /api call then returns 502 and the
  # dashboard sits on "reconnecting" with blank metrics, while `curl` straight
  # to :8000 answers 200 and makes it look like the frontend is at fault.
  #
  # Assigning the upstream to a variable forces resolution per request, and
  # 127.0.0.11 is Docker's embedded DNS server.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://api:8000;

  index index.html;

  location /api/ {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  location /media/ {
    proxy_pass $api_upstream;
  }

  # The offline basemap: one 6.7 MB PMTiles archive plus its glyphs. MapLibre
  # reads the archive with HTTP range requests, which nginx serves natively for
  # static files — that is the whole trick, and it means no tile server.
  # Content is immutable per build, so cache it hard: a demo reset must never
  # re-download the map.
  location /basemap/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    types { }
    default_type application/octet-stream;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
